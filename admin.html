<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administration | Alliance Properties</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1f33;--gold:#b8923f;--cream:#faf6ee;--line:#e2dccd;--mute:#6b7683;--red:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:#1d2733;font-size:14px}
h1,h2{font-family:'Cormorant Garamond',serif}
button,input,select,textarea{font:inherit}
.top{background:var(--navy);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px}.top h1 span{color:#d8b966}
.btn{padding:10px 18px;border-radius:3px;border:1px solid var(--gold);background:var(--gold);color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{opacity:.88}
.btn.out{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 12px;font-size:12px}
.demo{background:#fff3cd;color:#664d03;padding:10px 24px;font-size:13px;border-bottom:1px solid #ffe69c}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.login{max-width:380px;margin:12vh auto;background:#fff;padding:34px;border-radius:6px;border:1px solid var(--line)}
.login h2{font-size:30px;color:var(--navy);margin-bottom:6px}
.login p{color:var(--mute);margin-bottom:18px}
label{display:block;font-weight:600;font-size:12px;margin:12px 0 5px;color:var(--navy)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:#fff}
textarea{min-height:140px;resize:vertical}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.row{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;gap:14px;align-items:center;margin-bottom:10px}
.th{width:84px;height:64px;border-radius:3px;background:linear-gradient(135deg,#1a3150,#2d4d7a);flex:none;object-fit:cover}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px;color:var(--navy)}
.info small{color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--cream);border:1px solid var(--line);margin-right:4px}
.tag.off{background:#fde8e6;color:var(--red)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.modal{position:fixed;inset:0;background:rgba(8,16,28,.7);display:none;overflow:auto;padding:20px;z-index:10}
.modal.open{display:block}
.box{background:#fff;max-width:720px;margin:0 auto;border-radius:6px;padding:26px}
.box h2{font-size:28px;color:var(--navy);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chk{display:flex;gap:18px;margin-top:14px}.chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}.chk input{width:auto}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph div{position:relative}.ph img{width:90px;height:68px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer}
.ph button.star{right:auto;left:-6px;background:var(--gold)}
.ph .main img{outline:3px solid var(--gold)}
.err{color:var(--red);margin-top:10px;font-weight:500}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.row{flex-wrap:wrap}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script>
(function(){
const C=window.SITE_CONFIG, LIVE=!!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase);
const sb=LIVE?window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[], editing=null, photos=[];

/* ---------- stockage ---------- */
const LS='alliance_demo_listings';
async function fetchAll(){
  if(LIVE){const {data,error}=await sb.from('listings').select('*').order('created_at',{ascending:false});if(error)throw error;return data;}
  try{const s=localStorage.getItem(LS);if(s)return JSON.parse(s);}catch(e){}
  const d=window.SEED.map((x,i)=>Object.assign({id:'d'+i,published:true,created_at:new Date(Date.now()-i*1000).toISOString()},x));
  saveLocal(d);return d;
}
function saveLocal(d){try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}}
async function upsert(r){
  if(LIVE){
    if(r.id){const id=r.id;delete r.id;const {error}=await sb.from('listings').update(r).eq('id',id);if(error)throw error;}
    else{const {error}=await sb.from('listings').insert(r);if(error)throw error;}
  }else{
    if(r.id){items=items.map(x=>x.id===r.id?Object.assign(x,r):x);}
    else{items.unshift(Object.assign({id:'d'+Date.now(),created_at:new Date().toISOString()},r));}
    saveLocal(items);
  }
}
async function remove(id){
  if(LIVE){const {error}=await sb.from('listings').delete().eq('id',id);if(error)throw error;}
  else{items=items.filter(x=>x.id!==id);saveLocal(items);}
}

/* ---------- vues ---------- */
function loginView(msg){
  app.innerHTML=`<div class="login"><h2>Espace agence</h2><p>Accès réservé. Connectez-vous.</p>
  <form id="lf"><label>Email</label><input type="email" id="em" required autocomplete="username">
  <label>Mot de passe</label><input type="password" id="pw" required autocomplete="current-password">
  <div class="err" id="le">${esc(msg||'')}</div><button class="btn" style="width:100%;margin-top:16px">Se connecter</button></form></div>`;
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    if(error){const m=String(error.message||'');document.getElementById('le').textContent=/invalid login/i.test(m)?'Email ou mot de passe incorrect (ce n\'est PAS le mot de passe Gmail : c\'est celui créé dans Supabase).':/not confirmed/i.test(m)?'Compte non confirmé : dans Supabase, cochez « Auto Confirm User » ou confirmez l\'utilisateur.':/fetch|network/i.test(m)?'Impossible de joindre Supabase : vérifiez SUPABASE_URL dans config.js.':/api key/i.test(m)?'Clé invalide : vérifiez SUPABASE_ANON_KEY dans config.js.':('Erreur : '+m);}else start();
  };
}
async function listView(){
  try{items=await fetchAll();}catch(e){app.innerHTML='<div class="wrap err">Erreur de chargement : '+esc(e.message)+'</div>';return;}
  app.innerHTML=`<div class="top"><h1>Alliance <span>Properties</span> · Admin</h1><div>${LIVE?'<button class="btn out sm" id="pw2">Mon mot de passe</button> <button class="btn out sm" id="lo">Déconnexion</button>':''}</div></div>
  ${LIVE?'':'<div class="demo"><b>Mode démo</b> : Supabase n\'est pas encore configuré. Les modifications restent dans ce navigateur uniquement et n\'apparaissent pas sur le site public. Voir LISEZMOI.md.</div>'}
  <div class="wrap"><div class="bar"><b>${items.length} bien(s)</b><button class="btn" id="add">+ Ajouter un bien</button></div>
  <div id="list">${items.map(rowHtml).join('')||'<p>Aucun bien.</p>'}</div></div>
  <div class="modal" id="md"><div class="box" id="bx"></div></div>`;
  if(LIVE){document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();start();};
    document.getElementById('pw2').onclick=async()=>{const p=prompt('Nouveau mot de passe (8 caractères minimum) :');if(!p)return;if(p.length<8){alert('Trop court.');return;}const {error}=await sb.auth.updateUser({password:p});alert(error?('Erreur : '+error.message):'Mot de passe changé.');};}
  document.getElementById('add').onclick=()=>openForm(null);
  document.getElementById('list').onclick=async e=>{
    const b=e.target.closest('button');if(!b)return;
    const id=b.dataset.id,it=items.find(x=>String(x.id)===id);
    try{
      if(b.dataset.a==='edit')openForm(it);
      else if(b.dataset.a==='del'){if(confirm('Supprimer définitivement « '+it.title+' » ?')){await remove(it.id);listView();}}
      else if(b.dataset.a==='pub'){await upsert({id:it.id,published:!it.published});listView();}
    }catch(err){alert('Erreur : '+err.message);}
  };
}
function rowHtml(l){
  const img=l.photos&&l.photos[0]?`<img class="th" src="${esc(l.photos[0])}" alt="">`:'<div class="th"></div>';
  const p=l.price?new Intl.NumberFormat('fr-FR').format(l.price)+' ₪':'—';
  return `<div class="row">${img}<div class="info"><b>${esc(l.title)}</b><small>${esc(l.city||'')} · ${p}</small><div style="margin-top:4px"><span class="tag">${l.type==='location'?'Location':'Vente'}</span>${l.published?'<span class="tag">En ligne</span>':'<span class="tag off">Masqué</span>'}${l.photos&&l.photos.length?'':'<span class="tag off">Sans photo</span>'}</div></div>
  <div class="acts"><button class="btn out sm" data-a="pub" data-id="${esc(l.id)}">${l.published?'Masquer':'Publier'}</button><button class="btn sm" data-a="edit" data-id="${esc(l.id)}">Modifier</button><button class="btn red sm" data-a="del" data-id="${esc(l.id)}">Supprimer</button></div></div>`;
}
function openForm(l){
  editing=l;photos=l&&l.photos?[...l.photos]:[];
  const v=k=>l&&l[k]!=null?esc(l[k]):'';
  document.getElementById('bx').innerHTML=`<h2>${l?'Modifier le bien':'Nouveau bien'}</h2><form id="f">
  <label>Titre *</label><input id="title" required value="${v('title')}">
  <div class="g3"><div><label>Type *</label><select id="type"><option value="vente">À vendre</option><option value="location">À louer</option></select></div>
  <div><label>Nature (ex. Appartement)</label><input id="kind" value="${v('kind')}"></div>
  <div><label>Prix (₪)</label><input id="price" type="number" min="0" value="${v('price')}"></div></div>
  <div class="g2"><div><label>Ville</label><input id="city" value="${v('city')}"></div><div><label>Adresse / quartier</label><input id="address" value="${v('address')}"></div></div>
  <div class="g3"><div><label>Pièces</label><input id="rooms" type="number" step="0.5" min="0" value="${v('rooms')}"></div>
  <div><label>Chambres</label><input id="bedrooms" type="number" min="0" value="${v('bedrooms')}"></div>
  <div><label>Surface (m²)</label><input id="area" type="number" min="0" value="${v('area')}"></div></div>
  <label>Étage</label><input id="floor" value="${v('floor')}">
  <label>Description</label><textarea id="description">${v('description')}</textarea>
  <label>Photos</label>
  ${LIVE?'<input type="file" id="file" accept="image/*" multiple>':''}
  <div style="display:flex;gap:8px;margin-top:8px"><input id="url" placeholder="ou coller l'adresse (URL) d'une photo"><button type="button" class="btn out" id="addurl">Ajouter</button></div>
  <div class="ph" id="ph"></div>
  <div class="chk"><label><input type="checkbox" id="published"> Visible sur le site</label><label><input type="checkbox" id="featured"> Mis en avant</label></div>
  <div class="err" id="fe"></div>
  <div class="foot"><button type="button" class="btn out" id="cancel">Annuler</button><button class="btn" id="save">Enregistrer</button></div></form>`;
  type.value=l?l.type:'vente';published.checked=l?!!l.published:true;featured.checked=l?!!l.featured:false;
  drawPh();
  document.getElementById('md').classList.add('open');
  cancel.onclick=()=>document.getElementById('md').classList.remove('open');
  addurl.onclick=()=>{const u=url.value.trim();if(u){photos.push(u);url.value='';drawPh();}};
  if(LIVE)file.onchange=async()=>{
    fe.textContent='Envoi des photos…';
    try{for(const f of file.files){
      const path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+f.name.replace(/[^\w.-]/g,'_');
      const {error}=await sb.storage.from('photos').upload(path,await shrink(f),{contentType:'image/jpeg'});if(error)throw error;
      photos.push(sb.storage.from('photos').getPublicUrl(path).data.publicUrl);}
      fe.textContent='';drawPh();file.value='';
    }catch(err){fe.textContent='Erreur photo : '+err.message;}
  };
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const n=k=>{const x=document.getElementById(k).value;return x===''?null:Number(x)};
    const r={title:title.value.trim(),type:type.value,kind:kind.value.trim(),city:city.value.trim(),address:address.value.trim(),
      price:n('price'),rooms:n('rooms'),bedrooms:n('bedrooms'),area:n('area'),floor:floor.value.trim(),
      description:description.value.trim(),photos:photos,published:published.checked,featured:featured.checked};
    if(editing)r.id=editing.id;
    save.disabled=true;
    try{await upsert(r);document.getElementById('md').classList.remove('open');listView();}
    catch(err){fe.textContent='Erreur : '+err.message;save.disabled=false;}
  };
}
async function shrink(f){
  try{
    if(!/^image\/(jpeg|png|webp)$/.test(f.type)) return f;
    const bmp=await createImageBitmap(f), sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',0.85));
  }catch(e){return f;}
}
function drawPh(){
  const ph=document.getElementById('ph');
  ph.innerHTML=photos.map((p,i)=>`<div class="${i===0?'main':''}"><img src="${esc(p)}" alt="">${i>0?`<button type="button" class="star" data-s="${i}" title="Mettre en photo principale">★</button>`:''}<button type="button" data-i="${i}" title="Retirer">×</button></div>`).join('');
  ph.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.i,1);drawPh();});
  ph.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{const k=+b.dataset.s;photos.unshift(photos.splice(k,1)[0]);drawPh();});
}
async function start(){
  if(!LIVE)return listView();
  const {data}=await sb.auth.getSession();
  data.session?listView():loginView();
}
start();
})();
</script>
</body>
</html>
